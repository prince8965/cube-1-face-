<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube 1 face</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main" style="background-color: grey;">
        <div class="cube">
            <div class="row">
                <div class="box" style="background-color: red;">1</div>
                <div class="box" style="background-color: white;">2</div>
                <div class="box" style="background-color: blue;">3</div>
            </div>
            <div class="row">
                <div class="box" style="background-color: orange;">4</div>
                <div class="box" style="background-color: green;">5</div>
                <div class="box" style="background-color: yellow;">6</div>
            </div>
            <div class="row">
                <div class="box" style="background-color: bisque;">7</div>
                <div class="box" style="background-color: violet;">8</div>
                <div class="box" style="background-color: brown;">9</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
